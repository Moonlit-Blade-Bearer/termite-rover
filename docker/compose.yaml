# termite-rover 主控容器（Jetson Nano，宿主 L4T r32.7.6 / JetPack 4.6.6）
# 用法：docker compose -f docker/compose.yaml up -d
# 宿主 /etc/docker/daemon.json 已设 default-runtime=nvidia 与国内加速源
#
# 自启：restart: unless-stopped —— 宿主开机 Docker 自动拉起容器，
#       容器内 entrypoint.sh 直接启动建图栈（补齐补丁 → 等 /dev/rrc → launch）。
services:
  ros2:
    image: termite-ros:humble-l4t-r32.7.1   # docker/Dockerfile 构建（基础镜像 + 运行时依赖 + 补丁）
    container_name: termite_ros2
    network_mode: host            # DDS 跨机通信必需
    privileged: true              # 外设/GPIO/摄像头访问
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - /home/chl/ros2_ws:/root/ros2_ws          # 工作空间常驻宿主，容器重建不丢
      # 直接挂宿主 /dev：容器启动后再插拔的串口也能用，且 udev 软链 /dev/rrc 原样可见
      # （privileged 只在启动时快照 /dev，热插设备进不来，也不能单独 bind 一个软链）
      - /dev:/dev
      - /home/chl/termite-rover/docker:/root/docker:ro   # entrypoint / fixes 脚本
      # CUDA 运行时库：容器基础镜像只有 stub，torch 需要真实的 libcudart/cublas/curand 等
      - /usr/local/cuda-10.2/targets/aarch64-linux/lib:/usr/local/cuda-10.2/targets/aarch64-linux/lib:ro
      # cuDNN：容器里的 .so.8.2.1 是 0 字节占位，必须用宿主的真实库
      - /usr/lib/aarch64-linux-gnu/libcudnn.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_adv_infer.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn_adv_infer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_adv_train.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn_adv_train.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_cnn_infer.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn_cnn_infer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_cnn_train.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn_cnn_train.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_ops_infer.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn_ops_infer.so.8.2.1:ro
      - /usr/lib/aarch64-linux-gnu/libcudnn_ops_train.so.8.2.1:/usr/lib/aarch64-linux-gnu/libcudnn_ops_train.so.8.2.1:ro
    working_dir: /root/ros2_ws
    command: ["/root/docker/entrypoint.sh"]
    restart: unless-stopped
    # 进程级看护由 launch 的 respawn 负责；这里只兜"容器还在但 ROS 进程全死"的极端情况
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ros2 launch termite_bringup' >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
